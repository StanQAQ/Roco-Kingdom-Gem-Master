name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip "PySide6>=6.8" PyInstaller -r requirements-inference.txt

      - name: Build one-file GUI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Roco Kingdom Gem Master"
          --icon "../media/icon.ico"
          --distpath dist --workpath build --specpath build
          --exclude-module tests --exclude-module src.animation_demo
          --exclude-module simulate_balance --collect-all onnxruntime
          --add-data "../models;models" --add-data "../media;media" run_game.py

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: RocoKingdomGemMaster-Windows-x64
          path: dist/Roco Kingdom Gem Master.exe
          if-no-files-found: error
          retention-days: 14
