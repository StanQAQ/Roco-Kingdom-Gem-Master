name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6 PyInstaller

      - name: Build one-file GUI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MagicGems --distpath dist --workpath build --specpath build
          --add-data "media:media" run_game.py

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: MagicGems-Windows-x64
          path: dist/MagicGems.exe
          if-no-files-found: error
          retention-days: 14
